[project]
name = "mimir-flix"
version = "0.1.0"
description = "Your own streaming front end: manage what Jellyfin shows, search, and play on the phone, Mac or TV."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "adb-shell==0.4.4",
    "rsa>=4.9",
    "cryptography>=46",
    "jobkit",
    "qrcode>=8",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
mimir-flix = "mimir_flix.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.uv.sources]
jobkit = { git = "https://github.com/shrshk/jobkit" }
