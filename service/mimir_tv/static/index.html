<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const enc = encodeURIComponent;
const KINDS = {homevideos:"Home videos & photos", movies:"Movies", tvshows:"Shows", music:"Music", mixed:"Mixed"};
let libs = [];

async function api(path, opts = {}) {
  const r = await fetch(path, {headers:{"Content-Type":"application/json"}, ...opts, body: opts.body ? JSON.stringify(opts.body) : undefined});
  if (r.status === 204) return null;
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof d.detail === "string" ? d.detail : JSON.stringify(d.detail || d));
  return d;
}
const act = fn => async (...a) => { try { await fn(...a); await load(); } catch (e) { alert(e.message); } };

async function load() {
  libs = await api("/api/libraries");
  $("#libs").innerHTML = libs.length ? libs.map((l, i) => `<div class="card">
    <div class="row"><div class="grow"><h2>${esc(l.name)}</h2><div class="mute">${KINDS[l.kind] || esc(l.kind)} · ${l.items} items${l.refresh && l.refresh !== "Idle" ? ` · <span class="warn">${esc(l.refresh)}${l.progress != null ? " " + Math.round(l.progress) + "%" : ""}</span>` : ""}</div></div>
      <button onclick="addTo(${i}, 'folder')">Add folder</button><button onclick="addTo(${i}, 'video')">Add video</button>
      <button onclick="scanOne(${i})">Scan</button><button onclick="renameLib(${i})">Rename</button><button class="x" title="Remove library" onclick="delLib(${i})">✕</button></div>
    <ul>${l.folders.map((f, j) => `<li><span>📁</span><span class="grow">${esc(f.path)}${f.available ? "" : ` <span class="warn">(not connected)</span>`}
        ${f.excluded.map((x, k) => `<br><span class="tag">skipped: ${esc(x.slice(f.path.length + 1))} <button class="x" onclick="unexclude(${i}, ${j}, ${k})">include</button></span>`).join("")}</span>
        <button class="x" onclick="excludeIn(${i}, ${j})">Exclude a subfolder</button><button class="x" title="Remove folder" onclick="delFolder(${i}, ${j})">✕</button></li>`).join("")}
      ${l.videos.map((v, j) => `<li><span>🎞</span><span class="grow">${esc(v.name)} <span class="mute">${esc(v.target)}</span>${v.available ? "" : ` <span class="warn">(not connected)</span>`}</span><button class="x" title="Remove video" onclick="delVideo(${i}, ${j})">✕</button></li>`).join("")}
      ${!l.folders.length && !l.videos.length ? `<li class="mute">Empty: add a folder or a video.</li>` : ""}</ul></div>`).join("")
    : `<div class="card mute">No libraries yet.</div>`;
}

async function tick() {
  try {
    const s = await api("/api/status");
    $("#scan").innerHTML = s.scan ? `Scanning… ${s.scan.progress}%<div class="bar"><i style="width:${s.scan.progress}%"></i></div>` : `<span class="ok">●</span> Jellyfin idle`;
    if (!$("#library").hidden && (s.scan || libs.some(l => l.refresh && l.refresh !== "Idle"))) load();
  } catch (e) { $("#scan").textContent = "Jellyfin not reachable"; }
}

const delLib = act(async i => { if (confirm(`Remove library "${libs[i].name}" from Jellyfin? Your files stay where they are.`)) await api(`/api/libraries/${enc(libs[i].name)}`, {method:"DELETE"}); });
const delFolder = act(async (i, j) => { const l = libs[i]; if (confirm(`Stop showing ${l.folders[j].path}?`)) await api(`/api/libraries/${enc(l.name)}/folders?path=${enc(l.folders[j].path)}`, {method:"DELETE"}); });
const delVideo = act(async (i, j) => { const l = libs[i]; await api(`/api/libraries/${enc(l.name)}/videos/${enc(l.videos[j].name)}`, {method:"DELETE"}); });
// By position, never a folder name inside the onclick (a name with a quote would be script).
const unexclude = act(async (i, j, k) => api(`/api/libraries/${enc(libs[i].name)}/exclude?path=${enc(libs[i].folders[j].excluded[k])}`, {method:"DELETE"}));
const scanOne = act(async i => api(`/api/libraries/${enc(libs[i].name)}/scan`, {method:"POST"}));
const scanAll = act(async () => api("/api/scan", {method:"POST"}));
const renameLib = act(async i => { const n = prompt("New name", libs[i].name); if (n && n !== libs[i].name) await api(`/api/libraries/${enc(libs[i].name)}`, {method:"PUT", body:{name:n}}); });

function newLibrary() {
  $("#dlgbody").innerHTML = `<h2>New library</h2><label>Name</label><input id="lname">
    <label>Kind</label><select id="lkind">${Object.entries(KINDS).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select>
    <div class="err" id="err"></div><div class="row" style="justify-content:flex-end;margin-top:14px"><button onclick="$('#dlg').close()">Cancel</button><button class="p" id="go">Create</button></div>`;
  $("#go").onclick = async () => {
    try { await api("/api/libraries", {method:"POST", body:{name:$("#lname").value.trim(), kind:$("#lkind").value}}); $("#dlg").close(); load(); }
    catch (e) { $("#err").textContent = e.message; }
  };
  $("#dlg").showModal();
}

// mode: folder (add a folder), video (add one file), exclude (pick a subfolder inside start)
function picker(title, start, mode, done) {
  const show = async path => {
    try {
      const b = await api("/api/browse?path=" + enc(path));
      const here = esc(b.path).replace(/'/g, "\\'");
      $("#dlgbody").innerHTML = `<h2>${esc(title)}</h2><div class="mute" style="margin-top:6px">${esc(b.path)}</div>
        ${mode !== "video" ? `<div class="row" style="margin-top:8px"><button class="p" id="here">${mode === "exclude" ? "Exclude this folder" : "Add this folder"}</button></div>` : ""}
        <div class="pick"><div><a data-p="${esc(b.parent)}">↑ up</a></div>
        ${b.dirs.map(d => `<div><span>📁</span><a data-p="${esc(b.path + "/" + d)}">${esc(d)}</a></div>`).join("")}
        ${mode === "video" ? b.videos.map(v => `<div><span>🎞</span><a data-v="${esc(b.path + "/" + v.name)}">${esc(v.name)}</a><span class="mute">${(v.bytes / 1e6).toFixed(0)} MB</span></div>`).join("") : ""}</div>
        <div class="err" id="err"></div><div class="row" style="justify-content:flex-end;margin-top:12px"><button onclick="$('#dlg').close()">Close</button></div>`;
      $("#dlgbody").querySelectorAll("[data-p]").forEach(a => a.onclick = () => show(a.dataset.p));
      $("#dlgbody").querySelectorAll("[data-v]").forEach(a => a.onclick = () => finish(a.dataset.v));
      if ($("#here")) $("#here").onclick = () => finish(b.path);
    } catch (e) { $("#dlgbody").querySelector("#err") ? $("#err").textContent = e.message : alert(e.message); }
  };
  const finish = async p => { try { await done(p); $("#dlg").close(); load(); } catch (e) { $("#err").textContent = e.message; } };
  show(start);
  $("#dlg").showModal();
}

function addTo(i, what) {
  const l = libs[i];
  picker(what === "folder" ? `Add a folder to ${l.name}` : `Add a video to ${l.name}`, "/Volumes", what,
    p => api(`/api/libraries/${enc(l.name)}/${what === "folder" ? "folders" : "videos"}`, {method:"POST", body:{path:p}}));
}

function excludeIn(i, j) {
  const l = libs[i];
  picker(`Exclude a subfolder of ${l.folders[j].path}`, l.folders[j].path, "exclude",
    p => api(`/api/libraries/${enc(l.name)}/exclude`, {method:"POST", body:{path:p}}));
}

// Watch: Home, search, My list and a provider's pages
let crumbs = [];  // [{title, node}] from the root
let current = null;

// Tabs: Home and Search share the Watch page; the logo always goes Home.
function showTab(tab) {
  document.querySelectorAll("[data-tab]").forEach(x => x.classList.toggle("on", x.dataset.tab === tab));
  $("#watch").hidden = tab === "library"; $("#library").hidden = tab !== "library";
  if (tab === "library") load();
  if (tab === "search") { $("#searchbar").hidden = false; $("#q").focus(); if (!$("#q").value.trim()) searchIdle(); }
  if (tab === "home") goHome();
  if (tab === "list") { $("#searchbar").hidden = true; $("#q").value = ""; open("__list", "My list", false); }
  scrollTo(0, 0);
}
function goHome() {
  $("#searchbar").hidden = true; $("#q").value = ""; crumbs = []; $("#dlg").close();
  document.querySelectorAll("[data-tab]").forEach(x => x.classList.toggle("on", x.dataset.tab === "home"));
  $("#watch").hidden = false; $("#library").hidden = true;
  open("", "", false); scrollTo(0, 0);
}
document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => showTab(b.dataset.tab));
// What sticks under the top bar (the search bar, a provider's header) sits exactly at its real height: no gap.
const headH = () => document.documentElement.style.setProperty("--headh", $("header").getBoundingClientRect().height + "px");
headH(); addEventListener("resize", headH); document.fonts?.ready.then(headH);
// ✎: Cinema ↔ Doodle on this device (Doodle turns to chalkboard in dark mode and on the TV by itself).
$("#theme").onclick = () => {
  const doodle = document.documentElement.dataset.theme !== "doodle";
  if (doodle) document.documentElement.dataset.theme = "doodle"; else delete document.documentElement.dataset.theme;
  try { localStorage.setItem("theme", doodle ? "doodle" : "cinema"); } catch (e) {}
  toast(doodle ? "Doodle theme on this device" : "Cinema theme on this device");
  requestAnimationFrame(headH);  // Doodle's logo changes the bar's height
};
$("#logo").onclick = e => { e.preventDefault(); goHome(); };
// Recent searches: the last 8 that led somewhere (Enter, or opening a result), kept on this device only.
function recent() { try { return JSON.parse(localStorage.getItem("recentSearches") || "[]"); } catch (e) { return []; } }
function rememberSearch() {
  const q = $("#q").value.trim();
  if (q.length < 2) return;
  const list = [q, ...recent().filter(x => x.toLowerCase() !== q.toLowerCase())].slice(0, 8);
  try { localStorage.setItem("recentSearches", JSON.stringify(list)); } catch (e) { /* private window: not kept */ }
}
function searchIdle() {
  $("#pagehead").hidden = true; pool = [];
  const list = recent();
  $("#grid").innerHTML = list.length
    ? `<div class="full recent"><div class="row"><h3 class="grow">Recent searches</h3><button class="alt" id="clearrecent">Clear</button></div>`
      + `<div class="chips">${list.map((q, i) => `<button class="chip" data-i="${i}">${esc(q)}</button>`).join("")}</div></div>`
    : `<div class="full mute" style="margin-top:8px">Search your own videos${provs().map(p => ", " + esc(p.name)).join("")}${streaming.ready ? " and your streaming apps" : ""}.</div>`;
  $("#grid").querySelectorAll(".chip").forEach(b => b.onclick = () => { $("#q").value = list[+b.dataset.i]; $("#q").dispatchEvent(new Event("input")); });
  if ($("#clearrecent")) $("#clearrecent").onclick = () => { try { localStorage.removeItem("recentSearches"); } catch (e) { /* nothing kept */ } searchIdle(); };
}
$("#q").addEventListener("keydown", e => { if (e.key === "Enter") { rememberSearch(); $("#q").blur(); } });

// TV mode (the mimir-tv TV app opens /?tv=1): the remote's arrows move between posters and buttons, OK opens,
// BACK goes back (the app asks window.tvBack), and the main button plays in the TV's own Jellyfin app.
const TV = new URLSearchParams(location.search).has("tv");
if (TV) document.documentElement.classList.add("tv");
const FOCUSABLE = 'a[href], button, input, [tabindex="0"]';
function visible(el) {
  const r = el.getBoundingClientRect();
  return r.width > 0 && r.height > 0 && !el.closest("[hidden]") && getComputedStyle(el).visibility !== "hidden";
}
function focusables() { return [...($("#dlg").open ? $("#dlg") : document).querySelectorAll(FOCUSABLE)].filter(visible); }
// The nearest item in the arrow's direction, of [{el, r}] (r: its rect), from the rect a (distance across the
// direction counts three times as much). Across, the gap between the edges counts, not between the centres: the
// full-width search box is straight above every poster, not far off to the side of the left column's.
// Left and right stay in the row while it has an item that way: rows that scroll sideways (and tiles of different
// widths) do not line up in columns, so a poster in the row above could be nearer than the next one in this row.
function nearest(key, a, items) {
  const side = key === "ArrowLeft" || key === "ArrowRight";
  const sameRow = b => Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top) > Math.min(a.height, b.height) / 2;
  const score = new Map();
  for (const {el, r: b} of items) {
    const dx = b.left + b.width / 2 - (a.left + a.width / 2), dy = b.top + b.height / 2 - (a.top + a.height / 2);
    const ahead = {ArrowRight: dx > 4, ArrowLeft: dx < -4, ArrowDown: dy > 4, ArrowUp: dy < -4}[key];
    const gapX = Math.max(0, b.left - a.right, a.left - b.right), gapY = Math.max(0, b.top - a.bottom, a.top - b.bottom);
    if (ahead) score.set(el, side ? Math.abs(dx) + 3 * gapY + Math.abs(dy) / 100 : Math.abs(dy) + 3 * gapX + Math.abs(dx) / 100);
  }
  // Up and down skip the bars pinned at the top (pinned: true) while the page has an item that way: the row above is
  // off screen when the focus is mid-screen, so the top bar would be nearer and a held key would bounce through it.
  const inRow = side ? items.filter(({el, r}) => score.has(el) && sameRow(r))
    : items.filter(({el, pinned}) => score.has(el) && !pinned);
  let best = null;
  for (const {el} of inRow.length ? inRow : items) if (score.has(el) && (!best || score.get(el) < score.get(best))) best = el;
  return best;
}
const PINNED = "header, #searchbar";  // stay on screen while the page scrolls
// held: the key is held down. Smooth scrolls then start before the last one ends and pile up (the page jerks), so a
// held key scrolls at once.
function move(key, held) {
  const all = focusables(), cur = document.activeElement;
  if (!all.includes(cur)) return all[0] && all[0].focus();
  const items = all.filter(el => el !== cur).map(el => ({el, r: el.getBoundingClientRect(), pinned: !!el.closest(PINNED)}));
  const best = nearest(key, cur.getBoundingClientRect(), items);
  if (best) {
    best.focus({preventScroll: true});
    best.scrollIntoView({block: "center", inline: "nearest", behavior: held ? "instant" : "smooth"});
  }
}
// A held key repeats faster than the TV lays out the page: at most one step per REPEAT_MS, the rest dropped.
const REPEAT_MS = 110;
const STALE_MS = 120;
let lastMove = 0;
// While a key is held, the focused poster skips its zoom and soft shadow (costly on a TV's GPU at each step).
if (TV) document.addEventListener("keyup", () => document.documentElement.classList.remove("held"));
function tvFocus() {
  if (!TV) return;
  const all = focusables();
  // A sheet starts on its first action (Play), not on ✕ above it.
  const el = all.find(x => x.closest("#dlg .acts")) || all.find(x => x.closest("#grid, #dlg, .hero")) || all[0];
  if (el) el.focus({preventScroll: true});
}
let lastFocus = null;
if (TV) document.addEventListener("keydown", e => {
  if (e.key === "Enter" && !$("#dlg").open) lastFocus = document.activeElement;  // where a sheet returns to
  const typing = document.activeElement && document.activeElement.tagName === "INPUT";
  if (e.key.startsWith("Arrow") && !(typing && (e.key === "ArrowLeft" || e.key === "ArrowRight"))) {
    e.preventDefault();
    const now = performance.now();
    if (e.repeat) document.documentElement.classList.add("held");
    // A slow TV queues a held key's repeats while it draws; they would play out after the key is let go (the focus
    // "keeps going"). A repeat older than STALE_MS when it gets here is dropped.
    // (An age below 0 or over a minute is a clock mismatch, not a queue: ignored, so a held key still moves.)
    const age = now - e.timeStamp, stale = age > STALE_MS && age < 60000;
    if (e.repeat && (now - lastMove < REPEAT_MS || stale)) return;
    lastMove = now;
    move(e.key, e.repeat);
  }
  else if (e.key === "Enter" && document.activeElement && document.activeElement.matches('[tabindex="0"]')) { e.preventDefault(); document.activeElement.click(); }
});
window.tvBack = () => {
  if ($("#player").open) { closePlayer(); return true; }
  if ($("#dlg").open) { $("#dlg").close(); return true; }
  if (!$("#library").hidden) { goHome(); return true; }
  if (crumbs.length || !$("#searchbar").hidden) { crumbs.length ? $("#back").click() : goHome(); return true; }
  return false;
};

// Jellyfin sits beside this app: flix.home.<domain> → jellyfin.home.<domain>, opened in Safari (or a new tab).
const JF = location.hostname.startsWith("flix.") ? `https://jellyfin.${location.hostname.slice(5)}` : "";
if (JF) { $("#jfl").href = `${JF}/web/`; $("#jfl").hidden = false; }
// On the iPhone the header link opens the Swiftfin app itself (a bare swiftfin:// link opens it where it was).
if (JF && /iPhone|iPad/.test(navigator.userAgent)) { $("#jfl").href = "swiftfin://"; $("#jfl").removeAttribute("target"); $("#jfl").textContent = "Swiftfin ↗"; }

// id: a link to the title in Jellyfin; play: the link plays it (an episode or a video), not only opens it (a show).
function toast(msg, id, play) {
  const t = $("#toast"); t.textContent = msg; t.style.display = "block";
  if (id) t.insertAdjacentHTML("beforeend", ` ${play ? jfOpen(id, "▶ Play", true) : jfOpen(id, "Open")}`);
  clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = "none", id ? 10000 : 3500);
}

let pool = [];  // videos shown as tiles (rows and search), opened by index
function tile(i, sub) {
  // The title is drawn on the poster too: it shows when there is no artwork (or it fails to load).
  const img = i.thumb ? `<img loading="lazy" decoding="async" src="${i.thumb}" alt="" onerror="this.remove()">` : "";
  const attrs = i.kind === "folder" ? `data-node="${esc(i.node || "")}"` : `data-video="${pool.push(i) - 1}"`;
  const line = sub || i.sub || "";
  // Where it plays: the house's apps, and the provider for its results (both when its title is on an app too).
  const badges = (i.apps || []).map(a => `<b class="${esc(a.app)}">${esc(a.name)}</b>`).concat(i.src ? [`<b class="prov">${esc(i.src)}</b>`] : []);
  const apps = badges.length ? `<span class="apps">${badges.join("")}</span>` : "";
  if (i.kind === "folder" && i.node) shows[i.node] = {thumb: i.thumb || "", sub: i.sub || "", apps: i.apps, tmdbRef: i.tmdbRef, tmdbTitle: i.tmdbTitle};  // for + My list on its page
  return `<div class="tile" tabindex="0" ${attrs} data-title="${esc(i.title)}"><div class="art"><span class="ph">${esc(i.title)}</span>${img}${i.jf_id ? `<span class="in">✓ Jellyfin</span>` : ""}${i.new ? `<span class="new">${i.new} new</span>` : ""}${apps}</div>`
    + (i.progress ? `<div class="bar2" style="width:${i.progress}%"></div>` : "")
    + `<div class="t">${esc(i.title)}</div>${line ? `<div class="s">${esc(line)}</div>` : ""}</div>`;
}

// How a video plays: Jellyfin first (its web app here, its TV app on the TV); playing here and Kodi are the others.
// On the iPhone, ▶ Jellyfin opens the item in the Swiftfin app (its swiftfin:// links; Swiftfin must be installed and
// signed in to this server) and "web" opens Safari. Elsewhere it opens Jellyfin in a browser tab.
const jfLink = id => `${JF}/web/#/details?id=${id}`;
const IOS = /iPhone|iPad/.test(navigator.userAgent);
let appIds = null;
if (IOS) api("/api/jf/app").then(r => appIds = r).catch(() => {});
const appLink = id => appIds ? `swiftfin://${appIds.server}/${appIds.user}/item/${id}` : jfLink(id);
// play: a video; Swiftfin's links only open its page, so the Air also tells the app to play it (Jellyfin's remote
// control, as for the TV app), once the app has come up. keepalive: the request survives the switch to Swiftfin.
const jfOpen = (id, label, play) => appIds
  ? `<a class="btn" href="${appLink(id)}"${play ? ` onclick="playInApp('${id}')"` : ""}>${label}</a><a class="alt" href="${jfLink(id)}" target="_blank">web</a>`
  : `<a class="btn" href="${jfLink(id)}" target="_blank">${label}</a>`;
function playInApp(id) {
  fetch("/api/jf/phone", {method: "POST", keepalive: true, headers: {"Content-Type": "application/json"}, body: JSON.stringify({id})}).catch(() => {});
}
function actions(v, k, ctx) {
  // A streaming title: its apps; in a sheet also My list and 👍/👎 (recommendations learn from them).
  if (v.tmdb) return appButtons(v) + (ctx === "sheet" ? listBtn({tmdb: v.tmdb, title: v.title}) + voteBtns(v) : "");
  return playActions(v, k, ctx) + appButtons(v);
}
function playActions(v, k, ctx) {
  const c = ctx === "sheet" ? 1 : 0;
  // + My list: in a sheet, and on the rows of a list of movies or channels (an episode belongs to its show).
  // A title already in the home library goes on My list by its Jellyfin id (in its sheet).
  const mine = v.id || v.jf_id ? (ctx === "sheet" || !v.id ? listBtn({jf: v.id || v.jf_id, title: v.title}) : "")
    : ctx !== "sheet" && current.episodic ? ""
    : listBtn({p: v.p, url: v.url, title: v.title, thumb: v.thumb, sub: v.sub, here: !!v.here, page: ctx === "sheet" ? v.page || "" : current.node || ""});
  if (TV) return `<button class="p" onclick="go('tv',${k},${c})">▶ Play</button>`
    + (kodiReady ? `<button class="alt" onclick="go('kodi',${k},${c})">Kodi</button>` : "") + mine;
  // Your videos and a provider's items Jellyfin has (jf_id, from Jellyfin itself): ▶ opens them in Jellyfin (Swiftfin
  // on the iPhone); others: ＋ adds them. Play here plays in this page, through Jellyfin when it has the item.
  const id = v.id || v.jf_id;
  const open = id ? jfOpen(id, "▶ Jellyfin", true) : `<button class="p" onclick="go('jf',${k},${c})">＋ Jellyfin</button>`;
  return `${open}<button onclick="go('tv',${k},${c})">📺 TV</button>`
    + (id || v.here ? `<button class="alt" onclick="go('here',${k},${c})">Play here</button>` : "")
    + (kodiReady ? `<button class="alt" onclick="go('kodi',${k},${c})">Kodi</button>` : "") + mine;
}

// The streaming apps (Netflix, Peacock …): where a title streams comes from TMDB on the Air. On the TV a button opens
// the app there (at its search for the title where it can); on the phone the app's link opens the app, and 📺 opens
// it on the TV instead.
let streaming = {ready: false, tv: false}, toOpen = [];
api("/api/streaming/status").then(r => streaming = r).catch(() => {});
const norm = t => t.toLowerCase().replace(/\(\d{4}\)|\[[^\]]*\]/g, "").replace(/[^a-z0-9]+/g, "");
const yearOf = t => (t.match(/\((\d{4})\)/) || [])[1] || "";
function appButtons(v) {
  return (v.apps || []).map((a, n) => {
    // TMDB's id (and title) lets the Air find the app's own link for the title (JustWatch), so the app opens at it.
    const tmdb = v.tmdb || v.tmdbRef || "", title = v.tmdbTitle || v.title.replace(/\s*\(\d{4}\)\s*$/, "");
    const k = toOpen.push({app: a.app, name: a.name, title, tmdb}) - 1;
    const go = `api/streaming/go?app=${enc(a.app)}&title=${enc(title)}&tmdb=${enc(tmdb)}`;
    const tv = `<button class="${TV && !v.url && !v.id && n === 0 ? "p" : "alt"}" onclick="openApp(${k})">${TV ? "▶ " : "📺 "}${esc(a.name)}</button>`;
    return TV ? tv : `<a class="${v.tmdb && n === 0 ? "btn" : "alt"}" href="${esc(go)}" target="_blank" rel="noopener">${esc(a.name)} ↗</a>` + (streaming.tv ? tv : "");
  }).join("");
}
async function openApp(k) {
  const o = toOpen[k];
  try { await api("/api/streaming/open", {method:"POST", body:{app: o.app, title: o.title, tmdb: o.tmdb}}); toast(`Opening ${o.name} on the TV`); }
  catch (e) { toast(e.message); }
}
// A search hit from the streaming apps that is also in Jellyfin or a provider shows once: there, with the apps added.
function mergeStreaming(streams, local) {
  return streams.filter(w => {
    const hits = local.filter(i => norm(i.title) === norm(w.title) && (!yearOf(i.title) || !w.year || yearOf(i.title) === w.year));
    hits.forEach(i => Object.assign(i, {apps: w.apps, tmdbRef: w.tmdb, tmdbTitle: w.title}));
    return !hits.length;
  });
}

// My list: one list for the house. Titles in the home library are Jellyfin favourites (every Jellyfin app shows them);
// titles on the streaming apps (by TMDB id) and each provider's shows and videos are kept on the Air, as pointers.
let saved = new Set(), shows = {}, toSave = [];
const keyOf = t => t.node || t.url || (t.tmdb ? "tmdb:" + t.tmdb : t.jf ? "jf:" + t.jf : "");
async function loadList() {
  const [library, titles, ...mine] = await Promise.all([
    api("/api/jf/list").catch(() => []),
    api("/api/list/titles").catch(() => []),
    ...provs().map(p => api(P(p.id) + "/list").catch(() => [])),
  ]);
  const l = [...library.map(t => ({...t, jf: t.id, key: "jf:" + t.id})), ...titles.map(t => ({...t, key: "tmdb:" + t.tmdb, sub: t.apps.map(a => a.name).join(", ") || t.year})), ...mine.flat()];
  saved = new Set(l.map(i => i.key));
  return l;
}
function listBtn(t) {
  const on = saved.has(keyOf(t));
  return `<button class="alt lb" data-key="${esc(keyOf(t))}" onclick="toggleList(${toSave.push(t) - 1})">${on ? "✓ My list" : "＋ My list"}</button>`;
}
async function toggleList(n) {
  const t = toSave[n], key = keyOf(t), on = saved.has(key);
  try {
    if (t.jf) {
      if (on) await api("/api/jf/list?id=" + enc(t.jf), {method:"DELETE"});
      else await api("/api/jf/list", {method:"POST", body:{id: t.jf}});
    } else if (t.tmdb && !t.node && !t.url) {
      if (on) await api("/api/list/titles?tmdb=" + enc(t.tmdb), {method:"DELETE"});
      else await api("/api/list/titles", {method:"POST", body:{tmdb: [t.tmdb]}});
    } else if (on) await api(P(t.p || pidOf(t.node)) + "/list?key=" + enc(key), {method:"DELETE"});
    else await api(P(t.p || pidOf(t.node)) + "/list", {method:"POST", body:t});
  } catch (e) { return toast(e.message); }
  on ? saved.delete(key) : saved.add(key);
  document.querySelectorAll(".lb").forEach(b => { if (b.dataset.key === key) b.textContent = on ? "＋ My list" : "✓ My list"; });
  toast(on ? "Removed from My list" : "Added to My list");
  if (current && current.node === "__list") myList();
}

// 👍/👎 on a streaming title: 👍 means more like it, 👎 leaves it out of every recommendation. Tap again to undo.
let votes = null;
function voteBtns(v) {
  if (!votes) { api("/api/recs/feedback").then(l => { votes = Object.fromEntries(l.map(x => [x.tmdb, x.vote])); paintVotes(); }).catch(() => {}); }
  const k = esc(v.tmdb), t = esc(v.title);
  return `<button class="alt vote" data-tmdb="${k}" data-title="${t}" data-v="up" onclick="vote(this)" aria-label="More like this">👍</button>`
    + `<button class="alt vote" data-tmdb="${k}" data-title="${t}" data-v="down" onclick="vote(this)" aria-label="Not for me">👎</button>`;
}
function paintVotes() {
  document.querySelectorAll(".vote").forEach(b => b.classList.toggle("on", (votes || {})[b.dataset.tmdb] === b.dataset.v));
}
async function vote(b) {
  const now = (votes || {})[b.dataset.tmdb] === b.dataset.v ? "clear" : b.dataset.v;
  try { await api("/api/recs/feedback", {method:"POST", body:{tmdb: b.dataset.tmdb, vote: now, title: b.dataset.title}}); } catch (e) { return toast(e.message); }
  votes = votes || {};
  if (now === "clear") delete votes[b.dataset.tmdb]; else votes[b.dataset.tmdb] = now;
  paintVotes();
  toast(now === "up" ? "Noted: more like this" : now === "down" ? "Noted: left out of recommendations" : "Cleared");
}

// A video tile (a movie in a row or in search) opens a sheet; it has its own context, the page's stays as it is.
let sheet = null;
function videoSheet(v) {
  sheet = {jf: !!v.id, title: v.title, videos: [v]};
  const close = `<button class="icon close" onclick="$('#dlg').close()" aria-label="Close">✕</button>`;
  $("#dlgbody").innerHTML = (v.thumb ? `<div class="banner"><img src="${v.thumb}" alt="">${close}</div>` : `<div class="grab"></div><div class="row" style="justify-content:flex-end;padding:6px 8px 0">${close}</div>`)
    + `<div class="body"><h2>${esc(v.title)}</h2>${v.sub ? `<div class="mute">${esc(v.sub)}</div>` : ""}${v.desc ? `<p class="desc">${esc(v.desc)}</p>` : ""}
      <div class="row acts">${actions(v, 0, "sheet")}${v.show ? `<button class="alt" data-show>Go to show ›</button>` : v.id && v.type === "Movie" && current.node !== "jfmovie:" + v.id ? `<button class="alt" data-show>Go to movie ›</button>` : ""}</div></div>`;
  // An episode (Next up, Continue watching): its show's page, with the seasons and the other episodes; a movie: its
  // own page.
  const toShow = $("#dlgbody [data-show]");
  if (toShow) toShow.onclick = () => { $("#dlg").close(); v.show ? open(v.show, v.show_title) : open("jfmovie:" + v.id, v.title); };
  $("#dlg").classList.add("sheet");
  $("#dlg").showModal();
}
$("#dlg").addEventListener("close", () => { $("#dlg").classList.remove("sheet"); if (TV && lastFocus) lastFocus.focus({preventScroll: true}); });
// TV: a sheet takes the focus while open and gives it back to the poster it came from when it closes.
new MutationObserver(() => { if (TV && $("#dlg").open) tvFocus(); }).observe($("#dlg"), {attributes: true, attributeFilter: ["open"]});
$("#dlg").addEventListener("click", e => { if (e.target === $("#dlg")) $("#dlg").close(); });  // tap outside closes

// The show an episode belongs to: this page, or its parent when this page is one season of it.
function showOf(ctx) {
  const c = /^(season|part|volume)\b/i.test(ctx.title) && crumbs.length > 1 ? crumbs[crumbs.length - 2] : ctx;
  return {node: c.node, title: c.title};
}

async function go(how, k, fromSheet) {
  const ctx = fromSheet ? sheet : current, v = ctx.videos[k];
  $("#dlg").close();
  if (how === "here") return playHere(ctx, v);
  const title = ctx.videos.length === 1 ? ctx.title : v.title;
  try {
    if (how === "kodi") {
      await api(ctx.jf ? "/api/jf/kodi" : P(v.p) + "/kodi", {method:"POST", body: ctx.jf ? {id:v.id} : {url:v.url, title}});
      return toast("Playing with Kodi on the TV");
    }
    // Jellyfin has it already: play it by its id (adding it again would rewrite its file mid-play).
    const known = ctx.jf ? v.id : how === "tv" && v.jf_id;
    if (known) { await api("/api/jf/tv", {method:"POST", body:{id:known}}); return toast("Playing in Jellyfin on the TV"); }
    toast(how === "tv" ? "Starting in Jellyfin on the TV…" : "Adding to Jellyfin…");
    const tv = how === "tv";
    const r = ctx.episodic
      ? await api(P(v.p) + "/jellyfin", {method:"POST", body:{...showOf(ctx), episode:v.url, tv}})
      : await api(P(v.p) + "/jellyfin/video", {method:"POST", body:{url:v.url, title, tv, page: fromSheet ? v.page || "" : ctx.node || ""}});
    // A window opened after this wait is blocked on the iPhone, so the link is tapped from the message.
    markAdded(ctx, v, r.id, !!fromSheet);
    if (tv) toast("Playing in Jellyfin on the TV");
    else toast("Added to Jellyfin", r.id, true);
  } catch (e) { toast(e.message); }
}

async function openShow() {
  toast("Adding to Jellyfin…");
  try {
    const s = showOf(current);
    const r = await api(P(pidOf(s.node)) + "/jellyfin", {method:"POST", body:s});
    toast("Added to Jellyfin", r.id);
    reloadPage();
  } catch (e) { toast(e.message); }
}

// After an add, the buttons and badges say so. Adding an episode adds its whole show, so that page is read again
// (Jellyfin then has an id for every episode); a single video just takes the id it was given.
function markAdded(ctx, v, id, fromSheet) {
  if (ctx.episodic && !fromSheet) return reloadPage();
  v.jf_id = id;
  if (fromSheet && $("#dlg").open) $("#dlg .acts").innerHTML = actions(v, 0, "sheet");
  document.querySelectorAll("#grid .ep .acts[data-k]").forEach(el => { if (current.videos[+el.dataset.k] === v) el.innerHTML = actions(v, +el.dataset.k); });
  document.querySelectorAll("#grid .tile[data-video]").forEach(t => {
    if (pool[+t.dataset.video] === v && !t.querySelector(".in")) t.querySelector(".art").insertAdjacentHTML("beforeend", `<span class="in">✓ Jellyfin</span>`);
  });
}
function reloadPage() { if (current && current.node) { const y = scrollY; open(current.node, current.title, false).then(() => scrollTo(0, y)); } }

function bindTiles(push, refocus = true) {
  const searching = !!$("#q").value.trim() && !crumbs.length;
  $("#grid").querySelectorAll(".tile[data-node]").forEach(t => t.onclick = () => { if (searching) rememberSearch(); open(t.dataset.node, t.dataset.title, push); });
  $("#grid").querySelectorAll(".tile[data-video]").forEach(t => t.onclick = () => { if (searching) rememberSearch(); videoSheet(pool[+t.dataset.video]); });
  if (refocus && document.activeElement !== $("#q")) tvFocus();  // TV: the new page's first item (not while typing a search)
}

function renderTrail() {
  $("#pagehead").hidden = !crumbs.length;
  if (!crumbs.length) return;
  $("#ptitle2").textContent = crumbs[crumbs.length - 1].title;
  $("#trail").innerHTML = crumbs.length > 1 ? [`<a data-i="-1">Home</a>`].concat(crumbs.slice(0, -1).map((c, i) => `<a data-i="${i}">${esc(c.title)}</a>`)).join(" › ") : "";
  $("#trail").querySelectorAll("a").forEach(a => a.onclick = () => {
    const i = +a.dataset.i;
    if (i < 0) goHome(); else { crumbs = crumbs.slice(0, i + 1); open(crumbs[i].node, crumbs[i].title, false); }
  });
}
$("#back").onclick = () => {
  if (crumbs.length > 1) { crumbs.pop(); const c = crumbs[crumbs.length - 1]; open(c.node, c.title, false); }
  else if ($("#q").value.trim()) { crumbs = []; renderTrail(); $("#q").dispatchEvent(new Event("input")); }
  else goHome();
};

async function open(node, title, push = true) {
  if (push && node) crumbs.push({title, node});
  renderTrail(); scrollTo(0, 0);
  $("#grid").innerHTML = `<div class="skel">${"<i></i>".repeat(8)}</div>`;
  try {
    if (!node) return home();
    if (node.startsWith("__sections:")) return sections(node.slice(11));
    if (node === "__list") return myList();
    if (node.startsWith("jfmovie:")) return moviePage(node.slice(8));
    const jfNode = node.startsWith("jf:");
    const d = jfNode ? await api("/api/jf/browse?id=" + enc(node.slice(3))) : await api(P(pidOf(node)) + "/browse?node=" + enc(node));
    const folders = d.items.filter(i => i.kind === "folder"), videos = d.items.filter(i => i.kind === "video");
    // A show Jellyfin has (jf_id) opens there; a season page whose episodes it all has needs no add button either.
    current = {node, title: title || d.title, items: d.items, jf: jfNode, jf_id: d.jf_id || "", inJf: !!d.jf_id || (videos.length > 0 && videos.every(v => v.jf_id))};
    const isShow = videos.length || (folders.length && folders.every(f => /season|part|volume/i.test(f.title)));
    let html = "";
    if (isShow && node && !jfNode && episodicShow(d.items)) html += `<div class="showbar">${d.items[0] && d.items[0].desc ? `<div class="mute">${esc(d.items[0].desc)}</div>` : ""}<div class="row big">${current.jf_id && !TV ? jfOpen(current.jf_id, "▶ Show in Jellyfin") : current.jf_id || current.inJf ? "" : `<button class="p" onclick="openShow()">＋ Add show to Jellyfin</button>`}${showSave()}${appButtons({title: current.title, ...(shows[node] || {})})}</div></div>`;
    if (jfNode && d.desc) html += `<div class="showbar"><div class="mute">${esc(d.desc)}</div></div>`;
    html += folders.map(f => tile(f, f.sub)).join("");
    current.episodic = !jfNode && videos.some(v => /episode|\bep\s*\d/i.test(v.title));
    current.videos = videos;
    if (videos.length) html += `<div class="eps">${videos.map((v, k) => `<div class="ep"><span class="grow">${esc(v.title)}${v.sub ? ` <span class="mute">${esc(v.sub)}</span>` : ""}</span>
      <span class="acts" data-k="${k}">${actions(v, k)}</span></div>`).join("")}</div>`;
    $("#grid").innerHTML = html || `<div class="full mute">Nothing here.</div>`;
    bindTiles(true);
  } catch (e) { $("#grid").innerHTML = `<div class="full err">${esc(e.message)}</div>`; }
}

// A movie's own page: its artwork, facts, play buttons and My list, who is in it, and the library's titles like it.
async function moviePage(id) {
  const m = await api("/api/jf/title?id=" + enc(id));
  pool = [];
  current = {node: "jfmovie:" + id, title: m.title, items: [], videos: [m], jf: true, jf_id: m.id};
  const facts = [m.year, m.minutes ? `${m.minutes} min` : "", m.rating, m.score ? `★ ${m.score}` : "", m.genres.join(", "),
    m.progress ? `${m.progress}% watched` : ""].filter(Boolean).join(" · ");
  const art = m.backdrop || big(m.thumb);
  let html = `<div class="hero">${art ? `<img src="${art}" alt="">` : ""}<div class="in"><h2>${esc(m.title)}</h2>${facts ? `<div class="s">${esc(facts)}</div>` : ""}
    <div class="row big">${playActions(m, 0)}${listBtn({jf: m.id, title: m.title})}</div></div></div>`;
  if (m.desc) html += `<div class="showbar"><div class="mute">${esc(m.desc)}</div></div>`;
  const people = [m.directors.length ? `Director: ${m.directors.join(", ")}` : "", m.cast.length ? `Cast: ${m.cast.join(", ")}` : ""].filter(Boolean);
  if (people.length) html += `<div class="full mute">${people.map(esc).join("<br>")}</div>`;
  if (m.more.length) html += `<div class="rowhead"><h3>More like this</h3></div><div class="strip">${m.more.map(i => tile(i)).join("")}</div>`;
  $("#grid").innerHTML = html;
  bindTiles(true);
}

// Play here tells Jellyfin what is watched (through the Air): where it was left and what was finished, so Continue
// watching and played marks are the same in every Jellyfin app, the TV's too. A video Jellyfin has starts where it
// was left, and an episode goes on to the next one.
let watching = null, nextTimer = null, nextItem = null;
function playHere(ctx, v) {
  // All of it inside the tap, before any wait: iOS starts a video only from a tap, so the source is a link the Air
  // sends on (to the file, or to Jellyfin's HLS) and the place it was left comes in alongside.
  cancelNext();
  $("#ptitle").textContent = ctx.videos.length === 1 ? v.title : `${ctx.title} · ${v.title}`;
  const id = ctx.jf ? v.id : v.jf_id || "";
  // Through Jellyfin when it has it, unless the provider's own stream plays here (no conversion needed).
  $("#video").src = id && (ctx.jf || !v.here) ? "/api/jf/play/" + enc(id) : P(v.p) + "/play?u=" + enc(v.url);
  watching = id ? {id, session: Array.from({length: 32}, () => (Math.random() * 16 | 0).toString(16)).join(""), started: false, sent: 0, start: 0} : null;
  // The lock screen and Control Center show what plays (AirPlay is in the player's own controls).
  if ("mediaSession" in navigator) navigator.mediaSession.metadata = new MediaMetadata({title: $("#ptitle").textContent, artwork: v.thumb ? [{src: new URL(v.thumb, location.href).href}] : []});
  $("#player").showModal();
  $("#video").play().catch(() => {});
  if (id) api("/api/jf/resume/" + enc(id)).then(r => { if (watching && watching.id === id) { watching.start = r.start; resumeAt(); } }).catch(() => {});
}
// Jumps to where it was left once both the place and the video's length are known (whichever comes second).
function resumeAt() {
  const v = $("#video");
  if (!watching || !watching.start || v.readyState < 1) return;
  if (!isFinite(v.duration) || watching.start < v.duration - 30) v.currentTime = watching.start;
  watching.start = 0;
}
$("#video").addEventListener("error", () => { if ($("#player").open && $("#video").getAttribute("src")) toast("This video cannot play here"); });
function report(event, beacon) {
  if (!watching) return;
  const v = $("#video"), body = {id: watching.id, session: watching.session, event, position: v.currentTime || 0,
    duration: isFinite(v.duration) ? v.duration : 0, paused: v.paused};
  watching.sent = Date.now();
  if (beacon) navigator.sendBeacon("/api/jf/playing", new Blob([JSON.stringify(body)], {type: "application/json"}));
  else api("/api/jf/playing", {method: "POST", body}).catch(() => {});
}
function stopWatching(beacon) { if (watching && watching.started) report("stopped", beacon); watching = null; }
$("#video").addEventListener("loadedmetadata", resumeAt);
$("#video").addEventListener("playing", () => { if (watching && !watching.started) { watching.started = true; report("start"); } });
$("#video").addEventListener("timeupdate", () => { if (watching && watching.started && Date.now() - watching.sent > 10000) report("progress"); });
$("#video").addEventListener("pause", () => { if (watching && watching.started && !$("#video").ended) report("progress"); });
$("#video").addEventListener("ended", async () => {
  const id = watching && watching.id;
  stopWatching();
  if (!id || !$("#player").open) return;
  const n = await api("/api/jf/next/" + enc(id)).catch(() => ({}));
  if (!n.id || !$("#player").open) return;
  // "A Show · S01E02 · Title" (the card's sub line also has the length)
  nextItem = {...n, title: n.sub ? `${n.sub.split(" · ").slice(0, 2).join(" · ")} · ${n.title}` : n.title};
  let left = 10;
  $("#nexttitle").textContent = nextItem.title;
  $("#nextsecs").textContent = left;
  $("#nextup").hidden = false;
  nextTimer = setInterval(() => { left -= 1; $("#nextsecs").textContent = left; if (left <= 0) playNext(); }, 1000);
});
function playNext() { const n = nextItem; cancelNext(); if (n) playHere({jf: true, title: "", videos: [n]}, n); }
function cancelNext() { clearInterval(nextTimer); nextTimer = null; nextItem = null; $("#nextup").hidden = true; }
addEventListener("pagehide", () => stopWatching(true));
// Picture in picture: the video keeps playing in a small window over other apps (Safari's own mini player).
function pip() {
  const v = $("#video");
  if (v.webkitSupportsPresentationMode && v.webkitSupportsPresentationMode("picture-in-picture")) {
    v.webkitSetPresentationMode(v.webkitPresentationMode === "picture-in-picture" ? "inline" : "picture-in-picture");
  } else if (document.pictureInPictureEnabled) {
    (document.pictureInPictureElement ? document.exitPictureInPicture() : v.requestPictureInPicture()).catch(e => toast(e.message));
  } else toast("This browser has no mini player");
}
function closePlayer() { stopWatching(); cancelNext(); $("#video").pause(); $("#video").removeAttribute("src"); $("#video").load(); $("#player").close(); }
$("#player").addEventListener("close", () => { stopWatching(); cancelNext(); $("#video").pause(); });

let searchTimer;
// Suggestions as you type: matching recent searches, each provider's titles (its local index) and movie and show
// titles (TMDB). One tap searches for it.
let suggTimer = null, picked = "";
function suggestFor(q) {
  clearTimeout(suggTimer);
  if (q.length < 2 || q === picked) { $("#sugg").innerHTML = ""; return; }
  suggTimer = setTimeout(async () => {
    const [titles, ...fromProviders] = await Promise.all([
      api("/api/streaming/suggest?q=" + enc(q)).catch(() => []),
      ...provs().map(p => api(P(p.id) + "/suggest?q=" + enc(q)).catch(() => [])),
    ]);
    const names = fromProviders.flat();
    if ($("#q").value.trim() !== q) return;
    const low = q.toLowerCase(), seen = new Set([low]), list = [];
    for (const t of [...recent().filter(r => r.toLowerCase().includes(low)), ...names, ...titles]) {
      if (!seen.has(t.toLowerCase())) { seen.add(t.toLowerCase()); list.push(t); }
    }
    $("#sugg").innerHTML = list.slice(0, 8).map(t => `<button class="chip">${esc(t)}</button>`).join("");
    $("#sugg").querySelectorAll(".chip").forEach(b => b.onclick = () => {
      $("#q").value = picked = b.textContent; $("#sugg").innerHTML = ""; rememberSearch(); $("#q").dispatchEvent(new Event("input"));
    });
  }, 120);
}

$("#q").addEventListener("input", () => {
  suggestFor($("#q").value.trim());
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => {
    const q = $("#q").value.trim();
    crumbs = []; renderTrail();
    if (!q) return searchIdle();
    $("#grid").innerHTML = `<div class="skel">${"<i></i>".repeat(8)}</div>`;
    // Results show as each source answers: your videos and your apps in a moment, a provider's own search in
    // seconds. null: still searching that source.
    const got = {mine: null, streams: null};
    for (const p of provs()) got["p:" + p.id] = null;
    let pick = "";  // the group chosen in the filter line; "" is all of them
    const draw = () => {
      if ($("#q").value.trim() !== q) return;
      const waiting = Object.values(got).some(v => v === null);
      // Each provider's groups, its name on every poster.
      const groups = provs().flatMap(p => (got["p:" + p.id] || []).map(g => ({...g, src: p.name})));
      const theirs = groups.flatMap(g => g.items);
      pool = [];
      let html = "";
      // Jellyfin first (Wholphin's library), the rest of the catalogue after it. A provider's title already in
      // Jellyfin shows once, as its Jellyfin result; one Jellyfin's search missed joins them, under In Jellyfin.
      const mine = got.mine || [];
      const inJf = new Set(mine.map(m => m.id));
      const late = groups.flatMap(g => g.items.filter(i => i.jf_id && !inJf.has(i.jf_id)).map(i => ({...i, src: g.src})));
      for (const g of groups) g.items = g.items.filter(i => !i.jf_id);
      const elsewhere = mergeStreaming(got.streams || [], mine.concat(late, theirs));
      // One grid of titles, best groups first, with a line of filters above it (a chip per group, with its count)
      // instead of a heading per group: a search over many lists ("telugu") leaves the screen to the titles.
      // Each poster says its section too: the same show is often in several, with different seasons.
      const sections = new Map();
      const add = (name, tiles) => tiles.length && sections.set(name, (sections.get(name) || []).concat(tiles));
      add("In Jellyfin", mine.map(m => tile(m)).concat(late.map(i => tile(i, i.sub))));
      add("On your apps", elsewhere.map(w => tile(w, w.year)));
      for (const g of groups) add(g.section, g.items.map(i => tile({...i, src: g.src}, [g.section, i.sub].filter(Boolean).join(" · "))));
      if (!sections.has(pick)) pick = "";
      if (sections.size > 1) {
        const chip = (name, n) => `<button class="chip${name === pick ? " on" : ""}" data-sec="${esc(name)}">${esc(name || "All")}<small>${n}</small></button>`;
        html += `<div class="chips line">${chip("", [...sections.values()].flat().length)}${[...sections].map(([name, t]) => chip(name, t.length)).join("")}</div>`;
      }
      html += (pick ? sections.get(pick) : [...sections.values()].flat()).join("");
      const still = provs().filter(p => got["p:" + p.id] === null).map(p => p.name);
      if (html && waiting) html += `<div class="full mute" style="margin-top:12px">Still searching${still.length ? " " + esc(still.join(", ")) : ""}…</div>`;
      $("#grid").innerHTML = html || (waiting ? `<div class="skel">${"<i></i>".repeat(8)}</div>` : `<div class="full mute">Nothing matches “${esc(q)}”.</div>`);
      crumbs = []; bindTiles(true);
      $("#grid").querySelectorAll(".chip[data-sec]").forEach(b => b.onclick = () => { pick = b.dataset.sec; draw(); });
    };
    const arrive = (key, p) => p.catch(() => []).then(v => { got[key] = v; draw(); });
    arrive("mine", api("/api/jf/search?q=" + enc(q)));
    arrive("streams", api("/api/streaming/search?q=" + enc(q)));
    for (const p of provs()) arrive("p:" + p.id, api(P(p.id) + "/search?q=" + enc(q)));
  }, 250);
});

// What a provider is busy with (e.g. rebuilding its index), under the search box.
let kodiReady = false;
async function provStatus() {
  const notes = await Promise.all(provs().map(p => api(P(p.id) + "/status").then(s => s.note).catch(() => "")));
  $("#idx").textContent = notes.filter(Boolean).join(" · ");
}

function showSave() {
  const s = showOf(current);
  // A show Jellyfin has is a Jellyfin favourite on My list, like anything in the library.
  const t = current.jf_id ? {jf: current.jf_id, title: s.title} : {p: pidOf(s.node), node: s.node, title: s.title, ...(shows[s.node] || {})};
  return listBtn(t).replace('class="alt lb"', 'class="lb"');
}

function episodicShow(items) {
  return items.some(i => i.kind === "video" && /episode|\bep\s*\d/i.test(i.title)) || items.some(i => i.kind === "folder" && /^season|^part/i.test(i.title));
}

// TMDB's 780 px poster for the featured title: the 342 px one in rows looks soft at full phone width.
const big = url => (url || "").replace("/t/p/w342/", "/t/p/w780/");

async function home() {
  crumbs = []; renderTrail(); pool = [];
  current = {node: "", title: "Home", items: [], videos: []};
  const head = (title, node, src) => `<div class="rowhead${src ? " sub" : ""}"><h3>${esc(title)}</h3>${node ? `<a data-see="${esc(node)}" data-title="${esc(title)}">See all ›</a>` : ""}</div>`;
  const strip = items => `<div class="strip">${items.map(i => tile(i)).join("")}</div>`;
  $("#grid").innerHTML = `<div class="skel">${"<i></i>".repeat(8)}</div>`;
  const gen = ++homeGen;
  const still = () => gen === homeGen && current.title === "Home" && !crumbs.length && !$("#q").value.trim();
  // The providers' rows are the slowest to come (they ask the provider) and sit at the bottom, collapsed: Home shows
  // without them and adds them when they come.
  const provP = Promise.all(provs().map(p => api(P(p.id) + "/home").then(rows => ({p, rows})).catch(e => { toast(e.message); return {p, rows: []}; })));
  const [mine, list, trending, apps, jfRows, recs] = await Promise.all([
    api("/api/jf/browse").catch(() => ({items: []})),
    loadList(),
    api("/api/streaming/trending").catch(() => []),
    api("/api/streaming/rows").catch(() => []),
    api("/api/jf/home").catch(() => ({resume: [], next_up: [], new: []})),
    api("/api/recs?category=worth_the_hype&limit=15").catch(() => ({items: []})),
  ]);
  if (!still()) return;
  // Featured: the top title trending on the house's apps (TMDB, its wide backdrop on wide screens), else the first
  // provider video with artwork (then Home waits for the providers' rows).
  const top = trending.find(t => t.backdrop || t.thumb);
  const provRows = top ? null : await provP;
  if (!still()) return;
  let html = "";
  if (top) {
    const k = pool.push(top) - 1;
    const img = top.backdrop && top.thumb
      ? `<picture><source media="(min-width:700px)" srcset="${top.backdrop}"><img src="${big(top.thumb)}" alt=""></picture>`
      : `<img src="${top.backdrop || big(top.thumb)}" alt="">`;
    html += `<div class="hero">${img}<div class="in"><h2>${esc(top.title)}</h2><div class="s">${esc([top.year, top.apps.map(a => a.name).join(", ")].filter(Boolean).join(" · "))}</div>
      <div class="row big">${appButtons(top)}<button onclick="videoSheet(pool[${k}])">ⓘ Info</button></div></div></div>`;
  }
  const pick = top ? null : provRows.flatMap(x => x.rows).flatMap(r => r.items).find(i => i.kind === "video" && i.thumb);
  if (pick) {
    const k = pool.push(pick) - 1;
    html += `<div class="hero"><img src="${pick.thumb}" alt=""><div class="in"><h2>${esc(pick.title)}</h2>${pick.sub ? `<div class="s">${esc(pick.sub)}</div>` : ""}
      <div class="row big">${TV ? `<button class="p" onclick="heroGo(${k}, 'tv')">▶ Play</button>` : pick.jf_id ? jfOpen(pick.jf_id, "▶ Jellyfin", true) : `<button class="p" onclick="heroGo(${k}, 'jf')">＋ Jellyfin</button>`}<button onclick="heroGo(${k}, 'tv')">📺 TV</button><button onclick="videoSheet(pool[${k}])">ⓘ Info</button></div></div></div>`;
  }
  // Jellyfin's own rows first: what was started, what comes next, what just arrived. Each video shows once, in the
  // first of these rows it is in.
  const shown = new Set();
  const once = items => items.filter(i => !shown.has(i.id) && shown.add(i.id));
  for (const [title, items] of [["Continue watching", jfRows.resume], ["Next up", jfRows.next_up], ["New episodes", jfRows.new]]) {
    const left = once(items);
    if (left.length) html += head(title) + strip(left);
  }
  if (recs.items.length) html += head("Worth the hype on your apps", "__recs") + strip(recs.items.map(recTile));
  if (list.length) html += head("My list", "__list") + strip(list);
  if (trending.length) html += head("Trending on your apps") + strip(trending);
  for (const a of apps) html += head(`Popular on ${a.name}`) + strip(a.items);
  if (mine.items.length) html += head("Your library") + strip(mine.items);
  // Each provider: one section at the bottom, collapsed unless opened on this device.
  const provHtml = provRows => {
    let html = "";
    for (const {p, rows} of provRows) {
      if (!rows.length) continue;
      const open = provOpen(p.id);
      html += `<button class="fold" data-fold="${esc(p.id)}" aria-expanded="${open}">${esc(p.name)} <span>${open ? "Hide" : "Show"} ${rows.length + 1} rows</span></button>`
        + `<div class="foldbody" data-foldbody="${esc(p.id)}"${open ? "" : " hidden"}>`;
      for (const r of rows) html += head(r.section, r.node, p.name) + strip(r.items);  // labelled: part of the provider's group, not Home's own rows
      html += head("All sections", "", p.name) + `<div class="strip"><div class="tile" tabindex="0" data-all="${esc(p.id)}"><div class="art"><span class="ph">Browse every section</span></div><div class="t">Browse every section</div></div></div></div>`;
    }
    return html;
  };
  $("#grid").innerHTML = html + (provRows ? provHtml(provRows) : "");
  bindTiles(true);
  bindHome();
  if (provRows) return;
  const later = await provP;
  if (!still()) return;
  $("#grid").insertAdjacentHTML("beforeend", provHtml(later));
  bindTiles(true, false);  // the focus stays where the remote has it
  bindHome();
}
let homeGen = 0;  // a newer Home drops what an older one was still waiting for
// Home's links, "Browse every section" tiles and the providers' Show/Hide (again after the providers' rows come)
function bindHome() {
  $("#grid").querySelectorAll("[data-see]").forEach(a => a.onclick = () => a.dataset.see === "__list" ? showTab("list") : a.dataset.see === "__recs" ? forYou() : open(a.dataset.see, a.dataset.title, true));
  $("#grid").querySelectorAll("[data-all]").forEach(t => t.onclick = () => sections(t.dataset.all));
  $("#grid").querySelectorAll("[data-fold]").forEach(b => b.onclick = () => {
    const body = $("#grid").querySelector(`[data-foldbody="${CSS.escape(b.dataset.fold)}"]`), open = body.hidden;
    body.hidden = !open; provOpen(b.dataset.fold, open);
    b.setAttribute("aria-expanded", open);
    b.querySelector("span").textContent = `${open ? "Hide" : "Show"} ${body.querySelectorAll(".rowhead").length} rows`;
  });
}
// Whether a provider's section is open on Home: per device, a convenience only.
function provOpen(id, set) {
  try {
    if (set !== undefined) localStorage.setItem("provOpen:" + id, set ? "1" : "");
    return localStorage.getItem("provOpen:" + id) === "1";
  } catch (e) { return !!set; }
}
function heroGo(k, how) { sheet = {jf: false, title: pool[k].title, videos: [pool[k]]}; go(how, 0, true); }

async function sections(pid) {
  const title = "All of " + ((provs().find(p => p.id === pid) || {}).name || "it");
  crumbs = [{title, node: "__sections:" + pid}]; renderTrail(); scrollTo(0, 0);
  const d = await api(P(pid) + "/browse"); pool = [];
  current = {node: "__sections:" + pid, title, items: d.items, videos: []};
  $("#grid").innerHTML = d.items.map(i => tile(i)).join(""); bindTiles(true);
}

// For you (E2): recommendations by category from TMDB, narrowed by apps, language, genre and movies or shows. Titles
// the house watched in Jellyfin are left out on the Air.
let recsOpts = null;
const recsQ = {category: "worth_the_hype", apps: "", language: "any", genre: "", kind: "any"};
function recTile(i) {
  return {...i, sub: `★ ${i.rating} · ${i.apps.map(a => a.name).join(", ") || i.year}`, desc: `${i.why} ${i.desc}`};
}
async function forYou(change) {
  Object.assign(recsQ, change || {});
  crumbs = [{title: "For you", node: "__recs"}]; renderTrail(); scrollTo(0, 0);
  if (!recsOpts) recsOpts = await api("/api/recs/options").catch(() => null);
  if (!recsOpts) { $("#grid").innerHTML = `<div class="full mute">Recommendations need the TMDB token (tmdb-token).</div>`; return; }
  const sel = (key, label, opts) => `<select data-k="${key}" aria-label="${label}">${opts.map(([v, l]) =>
    `<option value="${esc(v)}"${String(recsQ[key]) === String(v) ? " selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
  const bar = `<div class="full recbar"><div class="chips">${Object.entries(recsOpts.categories).map(([k, l]) =>
      `<button class="chip${k === recsQ.category ? " on" : ""}" data-cat="${k}">${esc(l)}</button>`).join("")}</div>
    <div class="recsel">${sel("apps", "Apps", [["", "Your apps"], ["any", "Any app"], ...recsOpts.apps.map(a => [a.key, a.name])])}
    ${sel("language", "Language", Object.entries(recsOpts.languages))}
    ${sel("genre", "Genre", [["", "Any genre"], ...recsOpts.genres.map(g => [g, g[0].toUpperCase() + g.slice(1)])])}
    ${sel("kind", "Movies or shows", [["any", "Movies & shows"], ["movie", "Movies"], ["show", "Shows"]])}</div></div>`;
  const bind = () => {
    $("#grid").querySelectorAll("[data-cat]").forEach(b => b.onclick = () => forYou({category: b.dataset.cat}));
    $("#grid").querySelectorAll(".recsel select").forEach(x => x.onchange = () => forYou({[x.dataset.k]: x.value}));
  };
  $("#grid").innerHTML = bar + `<div class="skel full">${"<i></i>".repeat(8)}</div>`; bind();
  const q = new URLSearchParams(Object.entries(recsQ).filter(([, v]) => v !== ""));
  let d;
  try { d = await api("/api/recs?" + q + "&limit=24"); } catch (e) { d = {items: [], error: e.message}; }
  if (crumbs[0]?.node !== "__recs") return;  // left while it loaded
  pool = [];
  const items = d.items.map(recTile);
  current = {node: "__recs", title: "For you", items, videos: []};
  $("#grid").innerHTML = bar + (items.length ? items.map(i => tile(i)).join("")
    : `<div class="full mute" style="margin-top:8px">${esc(d.error || "Nothing matches these filters. Try another category, or fewer filters.")}</div>`);
  bind(); bindTiles(true);
}

async function myList() {
  crumbs = [{title: "My list", node: "__list"}]; renderTrail();
  const list = await loadList(); pool = [];
  current = {node: "__list", title: "My list", items: list, videos: []};
  document.querySelectorAll("[data-tab]").forEach(x => x.classList.toggle("on", x.dataset.tab === "list"));
  $("#grid").innerHTML = list.length ? list.map(i => tile(i)).join("")
    : `<div class="full mute" style="margin-top:8px">Nothing saved yet. Use ＋ My list on a movie, show or channel to keep it here; nothing goes into Jellyfin until you add it.</div>`;
  // Remove in one tap: ✕ on each poster.
  $("#grid").querySelectorAll(".tile").forEach((t, n) => {
    const i = list[n];
    t.querySelector(".art").insertAdjacentHTML("beforeend", `<button class="rm" aria-label="Remove from My list">✕</button>`);
    t.querySelector(".rm").onclick = e => { e.stopPropagation(); toggleList(toSave.push(i) - 1); };
  });
  bindTiles(true);
}

// The iPhone's Home Screen app resumes the page it had instead of loading it again, so it would keep an old version
// after an update. When it comes back to the screen, it asks for the page's version and reloads if it changed
// (not while a video plays or a sheet is open).
let pageVersion = null;
api("/api/version").then(v => pageVersion = v.page).catch(() => {});
document.addEventListener("visibilitychange", async () => {
  if (!document.hidden) api("/api/streaming/status").then(r => streaming = r).catch(() => {});
  if (document.hidden || !pageVersion || $("#player").open || $("#dlg").open) return;
  try { if ((await api("/api/version")).page !== pageVersion) location.reload(); } catch (e) { /* offline: keep this one */ }
});

// Connectors: the providers set up here (each with its own section, search and My list entries), Kodi and the TV.
let connectors = {providers: []};
const provs = () => connectors.providers || [];
const P = id => "/api/p/" + enc(id);  // a provider's routes
const pidOf = node => (node || "").split("~")[0];  // a provider's folder is named <provider id>~<its address>
api("/api/connectors").catch(() => connectors).then(c => {
  connectors = c; kodiReady = !!c.kodi;
  document.documentElement.classList.toggle("noprov", !provs().length);
  if (provs().length) { provStatus(); setInterval(provStatus, 3000); }
  open("", "", false);
  if (location.hash === "#library") showTab("library");  // the setup page's Media step links here
});
tick(); setInterval(tick, 2000);
</script>
