<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>mimir-tv setup</title>
<style>
  :root { --bg:#000; --card:#181818; --ink:#f5f5f5; --mute:#a3a3a3; --line:#2a2a2a; --ok:#46d369; --bad:#e50914; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 -apple-system, system-ui, sans-serif;
         padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px); max-width:720px; margin:0 auto; }
  header { display:flex; align-items:center; gap:12px; padding:12px 0; }
  header a { color:var(--mute); text-decoration:none; font-size:14px; }
  h1 { font-size:20px; margin:0; flex:1; }
  .part { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px;
          display:grid; grid-template-columns:28px 1fr auto; gap:4px 10px; align-items:start; }
  .mark { font-size:20px; line-height:1.2; }
  .ok .mark { color:var(--ok); } .bad .mark { color:var(--bad); } .opt .mark { color:var(--mute); }
  .name { font-weight:600; } .why, .detail, .note { color:var(--mute); font-size:13px; }
  .note { grid-column:2 / 4; }
  pre { grid-column:2 / 4; margin:6px 0 0; white-space:pre-wrap; font-size:12px; color:var(--mute); max-height:160px; overflow:auto; }
  button, a.btn { font:inherit; font-weight:600; border:0; border-radius:8px; padding:8px 12px; background:var(--ink);
                  color:#000; text-decoration:none; white-space:nowrap; }
  button:disabled { background:#2a2a2a; color:var(--mute); }
  .mute { color:var(--mute); font-size:13px; }
  h2 { font-size:17px; margin:22px 0 4px; }
  details.step { background:var(--card); border:1px solid var(--line); border-radius:10px; margin-bottom:10px; }
  details.step summary { list-style:none; cursor:pointer; padding:12px 14px; display:flex; gap:10px; align-items:center; }
  details.step summary::-webkit-details-marker { display:none; }
  details.step .body { padding:0 14px 14px 52px; display:grid; gap:10px; }
  details.step.done .mark { color:var(--ok); } details.step.skipped .mark, details.step.todo .mark { color:var(--mute); }
  label { display:grid; gap:4px; font-size:13px; color:var(--mute); }
  input[type=text], input[type=password], input[type=url], select { font:inherit; color:var(--ink); background:#0d0d0d;
         border:1px solid var(--line); border-radius:8px; padding:9px 10px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  button.ghost { background:transparent; color:var(--mute); border:1px solid var(--line); }
  .msg { font-size:13px; } .msg.bad { color:var(--bad); } .msg.ok { color:var(--ok); }
</style>
</head>
<body>
<header><h1>Setup: what this Mac needs</h1><a href="settings">Settings</a><a href="./">mimir-tv</a></header>
<p class="mute" id="lead">Checking…</p>
<div id="parts"></div>
<h2>Set up mimir-tv</h2>
<p class="mute" id="wlead">Checking…</p>
<div id="steps"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let timer = null;

async function load() {
  const r = await fetch("api/prereqs");
  const d = await r.json();
  const missing = d.parts.filter(p => !p.ok && !p.optional).length;
  $("#lead").textContent = missing ? `${missing} needed part${missing > 1 ? "s" : ""} missing. Nothing is installed until you press its button and confirm.`
    : "Everything needed is here.";
  if (!d.here) $("#lead").textContent += " Installing works only on the Mac itself (this page at http://127.0.0.1 there).";
  $("#parts").innerHTML = d.parts.map(p => {
    const busy = p.installing.running;
    const cls = p.ok ? "ok" : p.optional ? "opt" : "bad";
    let act = "";
    if (!p.ok && p.link) act = `<a class="btn" href="${esc(p.link)}" target="_blank" rel="noopener">How to install</a>`;
    else if (!p.ok && p.install) act = `<button data-key="${esc(p.key)}" data-cmd="${esc(p.install)}" ${busy || !d.here ? "disabled" : ""}>${busy ? "Installing…" : "Install"}</button>`;
    const done = p.installing.ok === false ? `<pre>Install failed:\n${esc(p.installing.log)}</pre>`
      : p.installing.ok && p.after ? `<div class="note">${esc(p.after)}</div>` : "";
    return `<div class="part ${cls}"><div class="mark">${p.ok ? "✓" : p.optional ? "–" : "✗"}</div>
      <div><div class="name">${esc(p.name)}${p.optional ? " <span class='mute'>(optional)</span>" : ""}</div><div class="why">${esc(p.why)}</div><div class="detail">${esc(p.detail)}</div></div>
      <div>${act}</div>${done}</div>`;
  }).join("");
  document.querySelectorAll("button[data-key]").forEach(b => b.onclick = () => install(b.dataset.key, b.dataset.cmd));
  clearTimeout(timer);
  if (d.parts.some(p => p.installing.running)) timer = setTimeout(load, 3000);
}

async function install(key, cmd) {
  if (!confirm(`Install it now? This runs:\n\n${cmd}`)) return;
  const r = await fetch(`api/prereqs/${encodeURIComponent(key)}/install`, {method: "POST"});
  if (!r.ok) { alert((await r.json()).detail || "Could not start"); return; }
  load();
}
load();

// Setup steps (D9 step 2). Passwords go straight to the Mac (Jellyfin uses its admin's once; Kodi's goes to the
// vault); this page keeps none of them. Providers are added later, on the Settings page.
const FORMS = {
  jellyfin: d => `<p class="mute">mimir-tv's own Jellyfin key. On a new Jellyfin this user becomes its admin.</p>
    <label>Jellyfin address<input type="url" name="url" value="${esc(d.jellyfin_url)}"></label>
    <label>Admin user name<input type="text" name="name" autocomplete="username"></label>
    <label>Admin password<input type="password" name="password" autocomplete="current-password"></label>`,
  media: () => `<p class="mute">Pick the folders for Movies, Shows and Home videos on the Library page; each becomes a
    library. This step is done once one exists.</p><div class="row"><a class="btn" href="./#library">Open Library</a></div>`,
  streaming: d => `<p class="mute">Optional. Search then says which of your apps has a title. Free TMDB account:
    themoviedb.org → Settings → API → API Read Access Token (the long one).</p>
    <label>TMDB token (empty keeps the saved one)<input type="password" name="token" autocomplete="off"></label>
    <label>Your apps, comma-separated (netflix, prime, peacock …; empty counts every app)<input type="text" name="apps" value="${esc(d.apps)}"></label>
    <label>Country (two letters)<input type="text" name="region" maxlength="2" value="${esc(d.region)}"></label>`,
  languages: d => `<p class="mute">Optional. The languages your house watches, in order: what goes into Jellyfin
    from your providers and apps, and how Wholphin on the TV lays it out (your apps, then each language). How many
    titles, and the rest, is on the Settings page (Into Jellyfin).</p>
    <label>Languages, a comma between (e.g. Telugu, Hindi, English)<input type="text" name="languages" value="${esc(d.languages)}" autocomplete="off"></label>`,
  tv: d => `<p class="mute">Optional. 📺 TV starts videos and apps on the TV. After saving, Pair and accept the prompt
    on the TV. More TVs can be added on the Settings page.</p>
    <label>TV IP address<input type="text" name="host" value="${esc(d.tv_host)}"></label>
    <label>Kind<select name="kind"><option value="android">Android TV / Google TV</option><option value="fire">Fire TV (Fire Stick)</option></select></label>
    <label>Kodi on the TV (optional), e.g. http://192.168.1.20:8080<input type="url" name="kodi_url"></label>
    <label>Kodi web password<input type="password" name="kodi_password" autocomplete="off"></label>`,
  phones: d => `<p class="mute">How phones and the TV reach mimir-tv, and where they and the TV's Jellyfin open a provider's links: an address they can open
    (https when Jellyfin is on an https page).</p>
    <label>Resolver address<input type="url" name="resolver" value="${esc(d.resolver)}"></label>
    ${d.tailnet.name ? `<label class="row"><input type="checkbox" name="tailnet" checked> Phones open mimir-tv through Tailscale at ${esc(d.tailnet.url)} (the link and a QR code are on the Settings page)</label>` : `<p class="mute">Tailscale is not signed in on this Mac: phones can be added later, on the Settings page.</p>`}
    <label class="row"><input type="checkbox" name="direct" checked> mimir-tv listens on the home network too, for the TV (${esc(d.tv_url)})</label>`,
  backup: d => `<p class="mute">Optional. Each night at 3:30, mimir-tv's and Jellyfin's settings, lists and watch
    history (not the videos) go to a folder on this Mac; the newest 7 are kept.</p>
    <label>Backup folder<input type="text" name="dir" value="${esc(d.backup_dir)}" placeholder="/Volumes/Drive/mimir-tv"></label>
    ${d.offsite.configured
      ? `<label class="row"><input type="checkbox" name="offsite" checked> Also copy it off-site, encrypted, to this Mac's storage (${esc(d.offsite.where)})</label>`
      : `<p class="mute">An encrypted off-site copy (your own Backblaze storage) can be set up on the Settings page, Backups card, whenever you like.</p>`}`,
};
let wtimer = null;

async function wload() {
  let d;
  try { d = await (await fetch("api/setup")).json(); } catch (e) { $("#wlead").textContent = "mimir-tv is restarting…"; wtimer = setTimeout(wload, 2000); return; }
  const left = d.steps.filter(s => s.state === "todo");
  $("#wlead").textContent = d.locked ? "Setup is finished. Change anything on the Settings page."
    : left.length ? `${left.length} step${left.length > 1 ? "s" : ""} to go. Optional steps can be skipped and done later.`
    : "Every step is done or skipped: press Finish.";
  const first = left[0]?.key;
  $("#steps").innerHTML = d.steps.map(s => {
    const mark = s.state === "done" ? "✓" : s.state === "skipped" ? "–" : "○";
    const form = d.locked ? "" : `<form class="body" data-step="${s.key}">${FORMS[s.key](d.defaults)}
      <div class="row">${s.key === "media" ? `<button type="submit">Check</button>` : `<button type="submit">Save</button>`}
      ${s.key === "tv" ? `<button type="button" class="ghost" data-pair ${d.pairing.running ? "disabled" : ""}>${d.pairing.running ? "Look at the TV…" : "Pair"}</button>` : ""}
      ${s.optional ? `<button type="button" class="ghost" data-skip>Skip</button>` : ""}</div>
      ${s.key === "tv" && d.pairing.detail ? `<div class="msg ${d.pairing.ok ? "ok" : "bad"}">${esc(d.pairing.detail)}</div>` : ""}
      <div class="msg"></div></form>`;
    return `<details class="step ${s.state}" ${s.key === first ? "open" : ""}><summary><span class="mark">${mark}</span>
      <span class="name">${esc(s.name)}${s.optional ? " <span class='mute'>(optional)</span>" : ""}</span></summary>${form}</details>`;
  }).join("") + (d.locked ? "" : `<div class="row"><button id="finish" ${left.length ? "disabled" : ""}>Finish</button>
      <span class="mute">mimir-tv restarts with the new settings.</span></div>`);
  document.querySelectorAll("form[data-step]").forEach(f => {
    const step = f.dataset.step, msg = f.querySelector(".msg:last-child");
    const post = async (path, body) => {
      msg.className = "msg"; msg.textContent = "Saving…";
      const r = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json"}, body: body ? JSON.stringify(body) : undefined});
      const out = await r.json().catch(() => ({}));
      if (!r.ok) { msg.className = "msg bad"; msg.textContent = typeof out.detail === "string" ? out.detail : "Check the fields"; return; }
      if (out.restarting) { $("#wlead").textContent = "mimir-tv is restarting…"; setTimeout(wload, 3000); return; }
      wload();
    };
    f.onsubmit = e => {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(f));
      if (step === "phones") { body.direct = !!body.direct; body.tailnet = !!body.tailnet; }
      if (step === "backup") body.offsite = !!body.offsite;
      post(`api/setup/${step}`, step === "media" ? null : body);
    };
    f.querySelector("[data-skip]")?.addEventListener("click", () => post(`api/setup/${step}/skip`));
    f.querySelector("[data-pair]")?.addEventListener("click", () => post("api/setup/tv/pair"));
  });
  $("#finish")?.addEventListener("click", async () => {
    const r = await fetch("api/setup/finish", {method: "POST"});
    $("#wlead").textContent = r.ok ? "Finished: mimir-tv is restarting…" : ((await r.json()).detail || "Not yet");
    setTimeout(wload, 3000);
  });
  clearTimeout(wtimer);
  if (d.pairing.running) wtimer = setTimeout(wload, 3000);
}
wload();
</script>
</body>
</html>
